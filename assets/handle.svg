<svg xmlns="http://www.w3.org/2000/svg" width="760" height="132" viewBox="0 0 760 132" role="img" aria-label="snowy66 — Fullstack dev">
  <defs>
    <linearGradient id="flare" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#FFC14D"/><stop offset="50%" stop-color="#FF5A1F"/><stop offset="100%" stop-color="#E0182D"/></linearGradient>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="b"/>
      <feFlood flood-color="#FF5A1F" flood-opacity="0.8"/>
      <feComposite in2="b" operator="in" result="g"/>
      <feMerge><feMergeNode in="g"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .flicker{animation:p 5s ease-in-out infinite}
      @keyframes p{0%,100%{opacity:1}50%{opacity:.96}}
      @media (prefers-reduced-motion:reduce){.flicker{animation:none}}
    </style>
  </defs>
  <g class="flicker" filter="url(#glow)">
    <text x="380" y="70" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="6" fill="url(#flare)">snowy66</text>
  </g>
  <text x="380" y="104" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="4" fill="#8C7468">◂ FULLSTACK DEV ▸</text>
</svg>
