<svg xmlns="http://www.w3.org/2000/svg" width="760" height="64" viewBox="0 0 760 64" role="img" aria-label="Animated terminal build indicator">
  <style>
    .scan{animation:build 6.4s ease-in-out infinite}
    .cursor{animation:cursor 2.6s ease-in-out infinite}
    @keyframes build{
      0%{transform:translateX(0);opacity:.22}
      12%{opacity:.55}
      82%{opacity:.72}
      100%{transform:translateX(656px);opacity:.22}
    }
    @keyframes cursor{0%,100%{opacity:.38}50%{opacity:1}}
    @media (prefers-reduced-motion:reduce){.scan,.cursor{animation:none}.scan{transform:translateX(0);opacity:.55}.cursor{opacity:1}}
  </style>
  <text x="380" y="26" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="0.4" fill="#A79B84">
    <tspan>&gt; npm run </tspan><tspan fill="#D5B169">build</tspan><tspan class="cursor" fill="#D5B169">_</tspan>
  </text>
  <rect x="23" y="48" width="714" height="1" rx="0.5" fill="#494239"/>
  <rect class="scan" x="23" y="47" width="58" height="3" rx="1.5" fill="#D5B169"/>
</svg>
